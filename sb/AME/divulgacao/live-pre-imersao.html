<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Live de pré-imersão · Imersão AME</title>
<style>
  /* Chamada da live de pré-imersão, 03/11 às 21h. Mesma identidade da
     divulgacao.html: feed (1080 x 1350) e, com ?story, story (1080 x 1920). */
  @font-face{font-family:"Montserrat";src:url("../fontes/Montserrat-VF.ttf") format("truetype");font-weight:100 900}
  :root{--noite:#0C1A2E;--ouro:#C9A24B;--ouro-claro:#E2C489;--prata:#C9CBCE;--creme:#F2EFE8;--linha:#34465E}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  html.story,html.story body{height:1920px}
  html{background:#050A14}
  body{background:radial-gradient(ellipse 90% 60% at 50% 30%,#1C2A3C 0%,#0C1A2E 55%,#050A14 100%);
       color:var(--creme);font-family:"Montserrat",sans-serif;display:flex;flex-direction:column;
       align-items:center;padding:56px 80px 50px}
  .vivo{display:flex;align-items:center;gap:14px;border:1px solid var(--ouro);padding:11px 26px;
        font-size:18px;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:var(--ouro-claro)}
  .vivo i{width:12px;height:12px;border-radius:50%;background:#E0453A;box-shadow:0 0 0 5px rgba(224,69,58,.22)}
  .logo{width:440px;margin:30px 0 0}
  h1{font-family:Georgia,serif;font-weight:400;font-size:64px;line-height:1.08;text-align:center;margin-top:26px}
  h1 em{color:var(--ouro-claro)}
  .sub{margin-top:16px;font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--prata);text-align:center}
  .dupla{display:flex;gap:36px;margin-top:34px}
  .p{display:flex;flex-direction:column;align-items:center}
  .p img{width:236px;height:300px;object-fit:cover;border:2px solid var(--ouro);box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .p b{font-family:Georgia,serif;font-weight:400;font-size:27px;margin-top:16px}
  .quando{margin-top:auto;width:100%;display:flex;align-items:center;justify-content:center;gap:44px;
          border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:24px 0}
  .data{font-family:Georgia,serif;font-size:104px;line-height:1;color:var(--ouro-claro)}
  .sep{width:1px;align-self:stretch;background:var(--linha)}
  .hora{display:flex;flex-direction:column;gap:10px}
  .hora span{font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:var(--prata)}
  .hora b{font-family:Georgia,serif;font-weight:400;font-size:58px;line-height:1}
  .onde{margin-top:24px;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--prata)}
  .onde b{font-weight:600;color:var(--ouro-claro);text-transform:none;letter-spacing:.06em;font-size:1.25em;margin-left:6px}
  .cta{margin-top:22px;background:var(--ouro);color:#0C1A2E;font-size:21px;font-weight:600;
       letter-spacing:.26em;text-transform:uppercase;padding:18px 44px}
  .rodape{margin-top:20px;font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#9FB0C4}

  /* story: mais altura, tudo maior e com respiro */
  body.story{padding:150px 80px 170px}
  body.story .vivo{font-size:22px;padding:14px 32px}
  body.story .logo{width:560px;margin-top:50px}
  body.story h1{font-size:84px;margin-top:44px}
  body.story .sub{font-size:20px}
  body.story .dupla{margin-top:56px;gap:40px}
  body.story .p img{width:300px;height:384px}
  body.story .p b{font-size:31px}
  body.story .quando{padding:34px 0}
  body.story .data{font-size:140px}
  body.story .hora b{font-size:76px}
  body.story .hora span{font-size:20px}
  body.story .onde{font-size:23px;margin-top:36px}
  body.story .cta{font-size:26px;padding:24px 56px;margin-top:30px}
  body.story .rodape{font-size:18px;margin-top:26px}
</style>
</head>
<body>
<script>if(location.search.indexOf('story')>-1){document.documentElement.className='story';document.body.className='story'}</script>
  <div class="vivo"><i></i>Ao vivo</div>
  <img class="logo" src="../logo/ame-logo-transparente.png" alt="AME">
  <h1>Live de<br><em>pré-imersão</em></h1>
  <div class="sub">A agenda lota. O caixa não acompanha.</div>
  <div class="dupla">
    <div class="p"><img src="../fotos/sena-ame.jpg" alt=""><b>Gilberto Sena</b></div>
    <div class="p"><img src="../fotos/bittar-ame.jpg" alt=""><b>Dr. Stanley Bittar</b></div>
  </div>
  <div class="quando">
    <div class="data">03/11</div>
    <div class="sep"></div>
    <div class="hora"><span>Terça-feira</span><b>21h</b></div>
  </div>
  <div class="onde">No Instagram <b>@stanleybittar</b></div>
  <div class="cta">Ative o lembrete</div>
  <div class="rodape">Imersão AME &nbsp;·&nbsp; 14 e 15 de novembro &nbsp;·&nbsp; São Paulo</div>
</body>
</html>
