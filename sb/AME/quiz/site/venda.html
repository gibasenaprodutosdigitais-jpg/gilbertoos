<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imersão AME</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Montserrat:wght@400;500;600&display=swap">
<style>
  /* Desde 8/nov/2026 esta página só avisa que a Imersão AME foi cancelada (decisão dele):
     o botão de pagamento saiu. A página de vendas antiga está no histórico do git. */
  :root{
    --fundo:#081421; --noite:#0C1A2E; --carta:#112741; --borda:#23405F;
    --tinta:#F2EFE8; --fraca:#9FB0C4; --ouro:#C9A24B; --ouro-claro:#E2C489;
    --creme:#F4F1EA; --tinta-escura:#14202F; --cinza:#4A5568;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#081421 } }
  :root[data-theme="dark"]{ --fundo:#081421 }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
  #ingresso{scroll-margin-top:12px}
  html,body{margin:0;background:var(--fundo);color:var(--tinta)}
  body{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;line-height:1.6}
  .faixa{padding:56px 16px}
  .miolo{max-width:760px;margin:0 auto}
  .claro{background:var(--creme);color:var(--tinta-escura)}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro);margin:0 0 14px}
  .claro .eyebrow{color:#8A6A24}
  h1,h2,h3{font-family:"Libre Baskerville",Georgia,serif;font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
  h1{font-size:clamp(30px,7vw,46px)}
  h2{font-size:clamp(25px,5.5vw,36px);margin-bottom:22px}
  h1 em,h2 em{color:var(--ouro-claro)}
  .claro h2 em{color:#8A6A24}
  p{margin:0 0 14px}
  .fraco{color:var(--fraca)}
  .claro .fraco{color:var(--cinza)}

  .hero{text-align:center;padding-top:40px;background:radial-gradient(ellipse 90% 60% at 50% 20%,#1C2A3C 0%,#0C1A2E 55%,#081421 100%)}
  .hero img.logo{width:min(420px,88%);height:auto;margin:0 auto 26px;display:block}
  .hero h1{margin:18px 0 18px}
  .ola{color:var(--ouro-claro);font-size:15px;margin-bottom:6px}
  .fatos{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin:24px 0 30px;font-size:14px;
         letter-spacing:.14em;text-transform:uppercase;color:var(--fraca)}
  .fatos b{color:var(--tinta);font-weight:500}

  .cta{display:inline-block;background:var(--ouro);color:#0C1A2E;text-decoration:none;font-weight:600;
       letter-spacing:.16em;text-transform:uppercase;font-size:15px;padding:18px 34px;border:0;cursor:pointer;font-family:inherit}
  .cta:hover{background:var(--ouro-claro)}
  .cta:focus-visible{outline:2px solid var(--ouro-claro);outline-offset:3px}
  .aviso-link{display:none;margin-top:12px;font-size:14px;color:var(--ouro-claro)}

  .lista{list-style:none;padding:0;margin:0;display:grid;gap:12px}
  .lista li{background:#FBFAF6;border-left:4px solid var(--ouro);padding:14px 18px}
  .faixa:not(.claro) .lista li{background:var(--carta)}

  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .pessoa img{width:100%;aspect-ratio:3/4;object-fit:cover;border:2px solid var(--ouro);display:block}
  .pessoa h3{font-size:22px;margin:14px 0 4px}
  .pessoa .papel{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ouro)}
  .pessoa p{font-size:14px;margin-top:6px}

  .dias{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .dia{border:1px solid #CFC7B4;padding:22px}
  .dia h3{font-size:21px;margin:6px 0 12px}
  .dia ul{margin:0;padding-left:18px}
  .dia li{margin-bottom:6px}

  .preco{border:1px solid var(--borda);background:var(--noite);padding:34px 24px;text-align:center}
  .preco .de{font-family:"Libre Baskerville",Georgia,serif;font-size:22px;color:var(--fraca);text-decoration:line-through;text-decoration-color:var(--ouro)}
  .preco .por{font-family:"Libre Baskerville",Georgia,serif;font-size:clamp(52px,14vw,76px);color:var(--ouro-claro);line-height:1.1;margin:6px 0 4px}
  .preco .obs{font-size:14px;color:var(--fraca);margin-bottom:26px}

  .nao{border-left:4px solid #8E8E8E;padding:12px 18px;background:#ECE7DB;margin-top:20px}
  footer{padding:30px 16px 40px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5D6F86}

  @media (max-width:620px){ .dupla,.dias{grid-template-columns:1fr} .faixa{padding:44px 16px} }
</style>
</head>
<body>

<section class="faixa hero" style="min-height:100vh">
  <div class="miolo">
    <img class="logo" src="ame-logo.png" alt="AME: Administração, Marketing e Escala · Medicina, Odontologia, Estética">
    <p class="eyebrow">Aviso</p>
    <h1>A Imersão AME de 14 e 15 de novembro <em>foi cancelada.</em></h1>
    <p class="fraco">No lugar dela, Gilberto Sena e o Dr. Stanley Bittar fazem uma live toda quarta-feira, no Instagram.</p>
    <p class="fatos"><span>Acompanhe em <b style="text-transform:none;letter-spacing:.04em">@stanleybittar</b></span></p>
  </div>
</section>

<footer>AME · Administração, Marketing e Escala · Realização SB, Sena e Bittar</footer>

</body>
</html>
