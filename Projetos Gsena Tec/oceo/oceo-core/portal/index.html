<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#17335c; --azul-claro:#2a78d6; --laranja:#eb6834;
    --tinta:#1B2331; --fraco:#5B6579; --linha:#C7D0E0;
    --papel:#F4F6FA; --branco:#FFFFFF;
    --ok:#2E7D5B; --atencao:#B87309; --critico:#C0392B;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Archivo',sans-serif;background:var(--papel);color:var(--tinta);
       font-size:15px;line-height:1.5;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{background:var(--azul);color:#fff;padding:18px 28px;
         display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .marca{font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .marca small{display:block;font-size:11px;font-weight:400;opacity:.72;letter-spacing:.06em;}
  header .estado{font-size:12px;opacity:.8;}

  main{max-width:1100px;margin:0 auto;padding:26px 20px 60px;}
  .vazio{background:var(--branco);border:1px solid var(--linha);border-radius:10px;
         padding:34px;text-align:center;}
  .vazio h2{font-size:19px;margin-bottom:8px;}
  .vazio p{color:var(--fraco);max-width:52ch;margin:0 auto 18px;}

  button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
         border:0;border-radius:7px;padding:10px 18px;background:var(--azul-claro);color:#fff;}
  button:hover{filter:brightness(1.08);}
  button.fantasma{background:transparent;color:var(--azul-claro);
                  border:1.5px solid var(--azul-claro);}
  button.pequeno{padding:5px 11px;font-size:12px;border-radius:5px;}

  .empresa{background:var(--branco);border:1px solid var(--linha);border-radius:10px;
           padding:18px 22px;margin-bottom:20px;display:flex;justify-content:space-between;
           align-items:center;flex-wrap:wrap;gap:12px;}
  .empresa h1{font-size:19px;font-weight:700;}
  .empresa .cnpj{font-size:13px;color:var(--fraco);}

  h2.secao{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           color:var(--fraco);margin:26px 0 12px;}

  .pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;}
  .pilar{background:var(--branco);border:1px solid var(--linha);border-left:4px solid var(--linha);
         border-radius:9px;padding:14px 16px;}
  .pilar.ativo{border-left-color:var(--ok);}
  .pilar .cod{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;
              color:var(--azul);}
  .pilar .nome{font-size:13px;font-weight:600;margin:2px 0 8px;line-height:1.3;}
  .pilar .dep{font-size:11px;color:var(--fraco);margin-bottom:10px;min-height:15px;}
  .pilar .rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .selo{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
        padding:3px 8px;border-radius:20px;}
  .selo.on{background:rgba(46,125,91,.12);color:var(--ok);}
  .selo.off{background:rgba(91,101,121,.12);color:var(--fraco);}

  .alerta{background:var(--branco);border:1px solid var(--linha);border-left:4px solid var(--fraco);
          border-radius:9px;padding:13px 16px;margin-bottom:9px;}
  .alerta.atencao{border-left-color:var(--atencao);}
  .alerta.critico{border-left-color:var(--critico);}
  .alerta .topo{display:flex;gap:9px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
  .alerta .de{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
              background:var(--papel);padding:2px 7px;border-radius:4px;color:var(--azul);}
  .alerta .tit{font-weight:600;font-size:14px;}
  .alerta .det{font-size:13.5px;color:var(--fraco);}
  .alerta .via{font-size:11px;color:var(--fraco);margin-top:5px;}

  .simular{background:var(--branco);border:1px solid var(--linha);border-radius:10px;
           padding:18px 20px;margin-top:26px;}
  .simular p{font-size:13px;color:var(--fraco);margin-bottom:12px;max-width:66ch;}
  .botoes{display:flex;flex-wrap:wrap;gap:8px;}
  .erro{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.3);color:var(--critico);
        padding:10px 14px;border-radius:7px;margin-top:12px;font-size:13.5px;}
</style>
</head>
<body>

<header>
  <div class="marca">OCEO<small>SIMPLES. MAIS COMPLETO.</small></div>
  <div class="estado mono" id="estado">carregando…</div>
</header>

<main id="app"><div class="vazio">carregando…</div></main>

<script>
const api = (rota, opc) => fetch(rota, opc).then(async r => {
  const corpo = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(corpo.detail || `erro ${r.status}`);
  return corpo;
});

let empresaId = null;
let ultimoErro = "";

async function atualizarEstado(){
  try{
    const s = await api("/api/saude");
    document.getElementById("estado").textContent =
      `${s.empresas} empresa(s) · ${s.eventos} evento(s) no barramento`;
  }catch{ document.getElementById("estado").textContent = "sem conexão"; }
}

async function inicio(){
  const lista = await api("/api/empresas");
  if(lista.length){ empresaId = lista[0].id; return desenharPainel(); }
  document.getElementById("app").innerHTML = `
    <div class="vazio">
      <h2>Nenhuma empresa cadastrada</h2>
      <p>Crie uma empresa de demonstração para ver os cinco pilares conversando
         entre si. Nada aqui é salvo em banco ainda: é memória da sessão.</p>
      <button onclick="criarDemo()">Criar empresa de demonstração</button>
    </div>`;
}

async function criarDemo(){
  await api("/api/empresas", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      cnpj:"13.592.146/0001-15", razao_social:"Empresa Demonstração Ltda",
      regime:"simples_nacional", municipio:"Belo Horizonte", uf:"MG",
      pilares:["GC","GF"]
    })
  });
  const lista = await api("/api/empresas");
  empresaId = lista[0].id;
  desenharPainel();
}

async function acao(fn){
  ultimoErro = "";
  try{ await fn(); }catch(e){ ultimoErro = e.message; }
  desenharPainel();
}

const ativar   = c => acao(() => api(`/api/empresas/${empresaId}/pilares/${c}`, {method:"POST"}));
const desativar= c => acao(() => api(`/api/empresas/${empresaId}/pilares/${c}`, {method:"DELETE"}));
const evento   = (ev, origem, dados) => acao(() => api(`/api/empresas/${empresaId}/eventos`, {
  method:"POST", headers:{"Content-Type":"application/json"},
  body: JSON.stringify({evento:ev, origem:origem, dados:dados})
}));

async function desenharPainel(){
  const p = await api(`/api/empresas/${empresaId}/painel`);
  atualizarEstado();
  document.getElementById("app").innerHTML = `
    <div class="empresa">
      <div>
        <h1>${p.empresa.razao_social}</h1>
        <div class="cnpj mono">${p.empresa.cnpj} · ${p.empresa.regime.replace(/_/g," ")}</div>
      </div>
      <div class="cnpj">${p.eventos_no_periodo} evento(s) trocados entre pilares</div>
    </div>

    <h2 class="secao">Os cinco pilares</h2>
    <div class="pilares">
      ${p.pilares.map(pi => `
        <div class="pilar ${pi.ativo?"ativo":""}">
          <div class="cod">${pi.codigo}</div>
          <div class="nome">${pi.nome}</div>
          <div class="dep">${pi.depende_de.length ? "depende de "+pi.depende_de.join(", ") : "&nbsp;"}</div>
          <div class="rodape">
            <span class="selo ${pi.ativo?"on":"off"}">${pi.ativo?"ativo":"inativo"}</span>
            <button class="pequeno ${pi.ativo?"fantasma":""}"
              onclick="${pi.ativo?`desativar('${pi.codigo}')`:`ativar('${pi.codigo}')`}">
              ${pi.ativo?"desligar":"ligar"}</button>
          </div>
        </div>`).join("")}
    </div>
    ${ultimoErro ? `<div class="erro"><b>O sistema recusou:</b> ${ultimoErro}</div>` : ""}

    <h2 class="secao">O que os pilares falaram entre si</h2>
    ${p.alertas.length ? p.alertas.map(a => `
      <div class="alerta ${a.severidade}">
        <div class="topo"><span class="de mono">${a.pilar}</span><span class="tit">${a.titulo}</span></div>
        <div class="det">${a.detalhe}</div>
        ${a.origem ? `<div class="via mono">reagiu a ${a.origem}</div>` : ""}
      </div>`).join("")
      : `<div class="vazio"><p>Nenhum alerta ainda. Use os botões abaixo para
           disparar um fato e ver outro pilar reagir sozinho.</p></div>`}

    <div class="simular">
      <h2 class="secao" style="margin-top:0">Disparar um fato</h2>
      <p>Cada botão publica um fato em nome de um pilar. Quem reage é decidido
         pelo barramento, não pelo botão. Ligue e desligue pilares acima para
         ver a diferença na resposta.</p>
      <div class="botoes">
        <button onclick="evento('gc.apuracao_fechada','GC',{competencia:'09/2026',receita:120000,custo_fixo:70000,imposto:20000})">
          GC fecha apuração com carga alta</button>
        <button onclick="evento('gc.folha_processada','GC',{total:38500})">
          GC processa a folha</button>
        <button onclick="evento('gf.reserva_completa','GF',{meses_cobertos:3})">
          GF forma reserva de 3 meses</button>
        <button onclick="evento('gf.mistura_pf_pj','GF',{})">
          GF detecta mistura PF e PJ</button>
        <button onclick="evento('gf.fluxo_em_risco','GF',{})">
          GF sinaliza risco no caixa</button>
        <button onclick="evento('gm.venda_fechada','GM',{valor:18500})">
          GM fecha uma venda</button>
      </div>
    </div>`;
}

inicio();
</script>
</body>
</html>
