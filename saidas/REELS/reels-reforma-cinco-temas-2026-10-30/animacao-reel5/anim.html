<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>ICMS e ISS até 2033</title>
<link rel="stylesheet" href="../animacao-comum/comum.css">
<style>
  .ano { position: absolute; left: 70px; width: 940px; height: 100px; display: flex; align-items: center; }
  .ano .rot { width: 170px; font-family: Impact, sans-serif; font-size: 64px; }
  .ano .trilho { position: relative; width: 770px; height: 80px; }
  .ano .velho { position: absolute; left: 0; top: 0; height: 80px; background: var(--tinta); color: var(--papel);
                font-family: Impact, sans-serif; font-size: 52px; line-height: 80px; padding-left: 18px; box-sizing: border-box; overflow: hidden; white-space: nowrap; }
  .ano .novo { position: absolute; top: 0; height: 80px; background: var(--sinal); }
  .leg { display: inline-flex; align-items: center; gap: 14px; margin-right: 40px; font-size: 36px; font-weight: 700; }
  .leg i { display: inline-block; width: 36px; height: 36px; }
</style>
</head>
<body>
<div id="tela">

  <!-- cena 1: 2033 -->
  <div class="cena" id="c1">
    <div class="abs rotulo" style="left:70px; top:330px;">ICMS e ISS acabam em</div>
    <div class="abs grito" id="c1n" style="left:60px; top:480px; font-size:450px;">2033</div>
    <div class="abs sussurro" id="c1s" style="left:70px; top:1000px; width:900px;">Mas não de uma vez.</div>
  </div>

  <!-- cena 2: o calendário -->
  <div class="cena" id="c2">
    <div class="abs rotulo" style="left:70px; top:330px;">Quanto sobra da alíquota de hoje</div>
    <div id="anos"></div>
    <div class="abs" id="c2leg" style="left:70px; top:1260px;">
      <span class="leg"><i style="background:var(--tinta);"></i>ICMS e ISS</span>
      <span class="leg"><i style="background:var(--sinal);"></i>IBS entrando</span>
    </div>
  </div>

  <!-- cena 3: 10% da alíquota, não 10 pontos -->
  <div class="cena" id="c3">
    <div class="abs rotulo" style="left:70px; top:330px;">ICMS de 18% em 2029</div>
    <div class="abs grito" id="c3a" style="left:60px; top:420px; font-size:300px;">18%</div>
    <div class="abs grito" id="c3seta" style="left:620px; top:470px; font-size:200px;">→</div>
    <div class="abs grito" id="c3b" style="left:60px; top:740px; font-size:260px;">16,2%</div>
    <div class="etq" id="c3ok" style="left:740px; top:830px; font-size:64px;">CERTO ✓</div>
    <div class="abs grito" id="c3c" style="left:60px; top:1040px; font-size:220px; color:var(--apagado);">8%</div>
    <div class="abs" id="c3risco" style="left:50px; top:1120px; height:22px; background:var(--sinal); width:0;"></div>
    <div class="etq sinal" id="c3err" style="left:400px; top:1090px; font-size:64px;">ERRADO ✗</div>
    <div class="abs sussurro" id="c3s" style="left:70px; top:1300px; width:940px;">Cai 10% da alíquota. Não 10 pontos.</div>
  </div>

  <!-- cena 4: Eclesiastes -->
  <div class="cena escura" id="c4">
    <div class="abs rotulo" id="c4r" style="left:70px; top:420px; color:var(--apagado);">Eclesiastes 3:1</div>
    <div class="abs grito" id="c4a" style="left:70px; top:520px; font-size:170px;">TUDO TEM</div>
    <div class="abs grito" id="c4b" style="left:70px; top:680px; font-size:170px;">O SEU TEMPO</div>
    <div class="abs grito" id="c4c" style="left:70px; top:840px; font-size:170px; color:var(--sinal);">DETERMINADO.</div>
    <div class="assina" id="c4ass"><img src="../../../../identidade/logo-transparente-crop.png"><span>@gilbertosenaoficial</span></div>
  </div>

  <svg id="grao" width="1080" height="1920">
    <filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .38  0 0 0 0 .34  0 0 0 .9 0"/></filter>
    <rect width="100%" height="100%" filter="url(#ruido)"/>
  </svg>
</div>

<script src="../animacao-comum/comum.js"></script>
<script>
window.CENAS = { c1: [0, 3.5], c2: [3.5, 12.5], c3: [12.5, 18.5], c4: [18.5, 22.5] };
window.DURACAO = 22.5;

// fração da alíquota de ICMS/ISS que sobra em cada ano (LC 214/2025, transição)
const ANOS = [[2027, 1], [2028, 1], [2029, .9], [2030, .8], [2031, .7], [2032, .6], [2033, 0]];
const LARG = 770;
$('anos').innerHTML = ANOS.map(([a], i) =>
  `<div class="ano" id="a${i}" style="top:${430 + i * 115}px;"><div class="rot">${a}</div>` +
  `<div class="trilho"><div class="velho" id="v${i}"></div><div class="novo" id="n${i}"></div></div></div>`).join('');

window.desenhar = function (t) {
  let l = cena('c1', t);
  const e = saida(prog(l, 0, .5));
  $('c1n').style.transform = `translateX(${(1 - e) * -700}px)`;
  sobe('c1s', l, .8, 1.2, 30);

  // cada ano entra cheio e encolhe até a fração dele; o IBS ocupa o resto
  l = cena('c2', t);
  ANOS.forEach(([a, f], i) => {
    const ini = .3 + i * .8;
    sobe('a' + i, l, ini, ini + .3, 30);
    const enc = saida(prog(l, ini + .3, ini + .8));
    const frac = 1 + (f - 1) * enc;
    $('v' + i).style.width = (frac * LARG) + 'px';
    $('n' + i).style.left = (frac * LARG) + 'px';
    $('n' + i).style.width = ((1 - frac) * LARG) + 'px';
    $('v' + i).textContent = frac > .15 ? Math.round(frac * 100) + '%' : '';
    if (a === 2033 && enc >= 1) {
      $('n' + i).textContent = 'ACABOU';
      Object.assign($('n' + i).style, { color: 'var(--papel)', fontFamily: 'Impact, sans-serif', fontSize: '52px', lineHeight: '80px', paddingLeft: '18px', boxSizing: 'border-box' });
    } else $('n' + i).textContent = '';
  });
  sobe('c2leg', l, 6.2, 6.6, 30);

  l = cena('c3', t);
  sobe('c3a', l, 0, .4, 80);
  sobe('c3seta', l, .5, .8, 30);
  sobe('c3b', l, .9, 1.3, 80);
  carimbo('c3ok', l, 1.6);
  sobe('c3c', l, 2.4, 2.8, 60);
  $('c3risco').style.width = `${saida(prog(l, 3.0, 3.3)) * 280}px`;
  carimbo('c3err', l, 3.4, 3);
  sobe('c3s', l, 4.0, 4.4, 30);

  l = cena('c4', t);
  sobe('c4r', l, 0, .3, 30);
  ['c4a', 'c4b', 'c4c'].forEach((id, i) => sobe(id, l, .2 + i * .35, .5 + i * .35));
  $('c4ass').style.opacity = prog(l, 1.6, 2.0);
};
iniciar();
</script>
</body>
</html>
