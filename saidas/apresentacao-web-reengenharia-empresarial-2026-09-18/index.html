<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reengenharia Empresarial — Bloco 1 · Manhã</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#0F1419; --dark2:#0A0A0A; --paper:#F4F1EA;
    --ink:#151515; --body:#454545;
    --gold:#C9A227; --coral:#E0654F;
    --accent:#C9A227;
    --mute:#7c8894;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:100%; height:100%; background:var(--dark); overflow:hidden;}
  body{
    font-family:'Inter',sans-serif; color:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:absolute; inset:0; overflow:hidden;}

  /* fundo: vignette + grade isometrica sutil */
  .bg{position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 90% 70% at 78% 30%, rgba(201,162,39,0.07), transparent 60%),
      radial-gradient(ellipse 60% 50% at 10% 90%, rgba(0,0,0,0.35), transparent 60%),
      var(--dark);
  }
  .bg svg{position:absolute; right:-6%; bottom:-10%; width:62%; height:62%; opacity:0.10;}

  .topbar{position:absolute; top:0; left:0; right:0; height:64px; z-index:5;
    display:flex; align-items:center; justify-content:space-between; padding:0 44px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand img{width:22px; height:auto; opacity:0.95;}
  .brand .word{font-weight:800; font-size:13px; letter-spacing:0.18em; color:var(--paper);}
  .brand .sep{width:22px; height:1px; background:rgba(244,241,234,0.28);}
  .brand .kicker{font-weight:600; font-size:12.5px; letter-spacing:0.16em; color:var(--mute); text-transform:uppercase;}
  .navctl{display:flex; align-items:center; gap:14px; font-size:12.5px; color:var(--mute); letter-spacing:0.08em;}
  .navctl .count b{color:var(--paper); font-weight:700;}
  .navctl button{
    width:30px; height:30px; border-radius:50%; border:1px solid rgba(244,241,234,0.22);
    background:transparent; color:var(--paper); cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; transition:border-color .2s, background .2s;
  }
  .navctl button:hover{border-color:var(--accent); background:rgba(255,255,255,0.04);}

  .slide{position:absolute; inset:0; padding:0 8%; display:flex; flex-direction:column;
    justify-content:center; z-index:2; opacity:0; transform:translateY(16px);
    transition:opacity .48s cubic-bezier(0.22,0.61,0.36,1), transform .48s cubic-bezier(0.22,0.61,0.36,1);
    pointer-events:none;}
  .slide.active{opacity:1; transform:translateY(0); pointer-events:auto;}

  .icon{width:52px; height:52px; margin-bottom:32px; color:var(--accent);}
  .icon svg{width:100%; height:100%; stroke:var(--accent); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}

  .kicker-line{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .kicker-line .num{font-family:'Inter'; font-weight:800; font-size:14px; color:var(--accent); letter-spacing:0.06em;}
  .kicker-line .label{font-weight:700; font-size:13px; letter-spacing:0.24em; color:var(--accent); text-transform:uppercase;}
  .kicker-line .rule{height:1px; width:64px; background:var(--accent); opacity:0.7;}

  h1{font-family:'Fraunces',serif; font-weight:900; color:var(--paper);
    font-size:clamp(40px,6.2vw,86px); line-height:1.04; letter-spacing:-0.01em; max-width:15ch;}
  .sub{font-family:'Fraunces',serif; font-style:italic; font-weight:500; color:var(--mute);
    font-size:clamp(17px,2vw,24px); margin-top:20px; max-width:38ch;}

  .quote{font-family:'Fraunces',serif; font-weight:500; font-style:italic; color:var(--paper);
    font-size:clamp(26px,3.6vw,48px); line-height:1.28; max-width:26ch;}
  .quote .hi{color:var(--accent); font-style:normal; font-weight:700;}
  .ask{margin-top:28px; font-family:'Inter'; font-weight:700; font-size:clamp(17px,2vw,22px); color:var(--paper);}

  .eyebrow{font-weight:700; font-size:12.5px; letter-spacing:0.22em; color:var(--mute); text-transform:uppercase; margin-bottom:10px;}
  .label{font-family:'Fraunces',serif; font-weight:700; font-size:clamp(24px,3vw,36px); color:var(--accent); margin-bottom:26px;}
  ul.bullets{list-style:none; display:flex; flex-direction:column; gap:16px; max-width:34ch;}
  ul.bullets li{display:flex; align-items:flex-start; gap:14px; font-size:clamp(16px,1.7vw,20px); color:var(--paper); font-weight:500; line-height:1.4;}
  ul.bullets li .dia{flex:none; width:9px; height:9px; margin-top:6px; background:var(--accent); transform:rotate(45deg);}

  .stat-num{font-family:'Fraunces',serif; font-weight:900; font-size:clamp(64px,10vw,140px); color:var(--accent); line-height:1;}
  .stat-sub{font-size:clamp(16px,1.8vw,22px); color:var(--mute); max-width:34ch; margin-top:14px; font-weight:500;}

  .footer{position:absolute; bottom:0; left:0; right:0; z-index:5; padding:0 44px 30px;}
  .stepper{display:flex; gap:26px;}
  .step{flex:1; display:flex; flex-direction:column; gap:9px;}
  .step .bar{height:2px; background:rgba(244,241,234,0.14); position:relative; overflow:hidden;}
  .step .bar i{position:absolute; inset:0 100% 0 0; background:var(--coral); transition:right .5s ease;}
  .step.done .bar i, .step.active .bar i{right:0;}
  .step .name{font-size:11.5px; font-weight:700; letter-spacing:0.14em; color:var(--mute); text-transform:uppercase; transition:color .3s;}
  .step.active .name, .step.done .name{color:var(--paper);}

  .hint{position:absolute; bottom:30px; right:44px; z-index:5; font-size:11.5px; color:var(--mute); letter-spacing:0.06em;}

  .cover-lion{position:absolute; right:8%; top:50%; transform:translateY(-50%); width:min(30vw,320px); opacity:0.9;}
  .cover-lion img{width:100%; filter:drop-shadow(0 30px 60px rgba(0,0,0,0.5));}
</style>
</head>
<body>
<div id="stage">
  <div class="bg">
    <svg viewBox="0 0 400 400"><defs></defs>
      <g stroke="#C9A227" stroke-width="1">
        <path d="M0 200 L200 80 L400 200 L200 320 Z"/>
        <path d="M60 200 L200 120 L340 200 L200 280 Z"/>
        <path d="M120 200 L200 160 L280 200 L200 240 Z"/>
      </g>
    </svg>
  </div>

  <div class="topbar">
    <div class="brand">
      <img src="assets/leao.png" alt="">
      <span class="word">GILBERTO SENA</span>
      <span class="sep"></span>
      <span class="kicker" id="kicker-label">Reengenharia Empresarial</span>
    </div>
    <div class="navctl">
      <span class="count"><b id="count-cur">01</b> / <span id="count-total">19</span></span>
      <button id="btn-prev" title="Voltar (←)">‹</button>
      <button id="btn-next" title="Avançar (→)">›</button>
      <button id="btn-full" title="Tela cheia (F)">⛶</button>
    </div>
  </div>

  <div id="slides"></div>

  <div class="footer">
    <div class="stepper" id="stepper"></div>
  </div>
  <div class="hint">→ avança · ← volta · F tela cheia</div>
</div>

<script>
const ICONS = {
  sofisma: `<svg viewBox="0 0 64 64"><path d="M4 32 C 14 14, 50 14, 60 32 C 50 50, 14 50, 4 32 Z"/><circle cx="32" cy="32" r="9"/><line x1="10" y1="10" x2="54" y2="54"/></svg>`,
  armadilha: `<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="22"/><line x1="32" y1="22" x2="32" y2="34"/><line x1="32" y1="34" x2="41" y2="40"/><rect x="24" y="4" width="16" height="8" rx="2"/></svg>`,
  cegueira: `<svg viewBox="0 0 64 64"><path d="M4 34 C 14 44, 50 44, 60 34"/><line x1="12" y1="42" x2="8" y2="50"/><line x1="24" y1="47" x2="22" y2="55"/><line x1="40" y1="47" x2="42" y2="55"/><line x1="52" y1="42" x2="56" y2="50"/></svg>`,
  ralos: `<svg viewBox="0 0 64 64"><path d="M8 10 H56 L38 34 V50 L26 58 V34 Z"/></svg>`,
  diagnostico: `<svg viewBox="0 0 64 64"><circle cx="27" cy="27" r="17"/><line x1="39" y1="39" x2="58" y2="58"/></svg>`,
  ponte: `<svg viewBox="0 0 64 64"><line x1="6" y1="32" x2="52" y2="32"/><path d="M40 20 L52 32 L40 44"/></svg>`,
};

const TOPICS = ["SOFISMA","ARMADILHA","CEGUEIRA","RALOS","DIAGNÓSTICO"];

const SLIDES = [
  // 0 — CAPA
  { type:'cover', accent:'gold', topicIndex:-1,
    kicker:'BLOCO 1 · MANHÃ · 09H00–12H30',
    title:['A estrutura que sustenta','— ou derruba —','o seu negócio.'],
    sub:'Reengenharia Empresarial · Mapa Executivo' },

  // ---- TÓPICO 1 · SOFISMA
  { type:'marker', accent:'coral', topicIndex:0, icon:'sofisma',
    num:'01', label:'SOFISMA',
    title:['O Sofisma do','Faturamento'], sub:'A ilusão da empresa forte' },
  { type:'quote', accent:'coral', topicIndex:0,
    eyebrow:'O QUE VOCÊ PENSA HOJE',
    quote:'“Eu faturo <span class="hi">R$ 500 mil</span> por mês. Então eu sei gerir — e estou protegido.”' },
  { type:'list', accent:'coral', topicIndex:0,
    eyebrow:'NA EMPRESA', label:'Faturamento é métrica de vaidade',
    bullets:['R$ 500 mil/mês não é proteção — é só nota fiscal','Margem líquida + caixa é o que sustenta a família','Faturamento sem Reengenharia é correr um risco maior'] },

  // ---- TÓPICO 2 · ARMADILHA
  { type:'marker', accent:'coral', topicIndex:1, icon:'armadilha',
    num:'02', label:'ARMADILHA',
    title:['A Armadilha','de 2027'], sub:'O colapso silencioso do Split Payment' },
  { type:'list', accent:'coral', topicIndex:1,
    eyebrow:'NA EMPRESA', label:'Split Payment',
    bullets:['Hoje: cliente paga 100%, a guia vence depois — o caixa trabalha 30–40 dias','2027: retenção no ato do PIX ou cartão — o Leão morde primeiro','O prazo que hoje paga a folha, desaparece'] },
  { type:'quote', accent:'coral', topicIndex:1,
    eyebrow:'A URGÊNCIA',
    quote:'“Se você usava o prazo entre faturar e pagar a guia pra tocar a folha — isso vai acabar.”',
    ask:'Sua empresa tem fôlego pra rodar assim?' },

  // ---- TÓPICO 3 · CEGUEIRA
  { type:'marker', accent:'coral', topicIndex:2, icon:'cegueira',
    num:'03', label:'CEGUEIRA',
    title:['A Cegueira','Operacional'], sub:'O dono que virou síndico de luxo' },
  { type:'list', accent:'coral', topicIndex:2,
    eyebrow:'NA EMPRESA', label:'14 horas por dia presos no operacional',
    bullets:['Gera boleto, apaga incêndio, paga conta','Refém de fornecedor, escravo da equipe','Centraliza tudo — exaustão sem margem real'] },
  { type:'quote', accent:'coral', topicIndex:2,
    eyebrow:'O CONFRONTO',
    quote:'“Você não montou um negócio pra trabalhar mais do que todos os seus funcionários juntos. Construiu uma prisão com o seu CNPJ.”',
    ask:'Se você se afastar 30 dias, como fica sua empresa?' },

  // ---- TÓPICO 4 · RALOS
  { type:'marker', accent:'coral', topicIndex:3, icon:'ralos',
    num:'04', label:'RALOS',
    title:['Os 3 Ralos','Invisíveis'], sub:'Onde o seu dinheiro está vazando agora' },
  { type:'list', accent:'coral', topicIndex:3,
    eyebrow:'NA EMPRESA · RALO 1', label:'Caixa Misturado',
    bullets:['PF e PJ na mesma conta','Pró-labore maquiado','Patrimônio pessoal exposto ao Fisco'] },
  { type:'list', accent:'coral', topicIndex:3,
    eyebrow:'NA EMPRESA · RALO 2', label:'Pessoas & Passivos',
    bullets:['Contratos de trabalho mal estruturados','Risco de ações judiciais','Parcerias mal feitas'] },
  { type:'list', accent:'coral', topicIndex:3,
    eyebrow:'NA EMPRESA · RALO 3', label:'Ralo Tributário',
    bullets:['Enquadramento errado por anos','Contador "gerador de guias"','Zero estratégia fiscal'] },
  { type:'stat', accent:'coral', topicIndex:3,
    num:'10–25%', statSub:'do faturamento jogado no lixo — casos reais mapeados em diagnóstico, sem Reengenharia Empresarial' },

  // ---- TÓPICO 5 · DIAGNÓSTICO
  { type:'marker', accent:'coral', topicIndex:4, icon:'diagnostico',
    num:'05', label:'DIAGNÓSTICO',
    title:['O Diagnóstico'], sub:'O espelho antes do almoço' },
  { type:'quote', accent:'coral', topicIndex:4,
    eyebrow:'A PERGUNTA DEVASTADORA',
    quote:'“Se o Fisco cruzar seus dados com inteligência artificial hoje — ou o Split Payment entrar amanhã —”',
    ask:'seu patrimônio pessoal sobrevive, ou é arrastado junto com o CNPJ?' },

  // ---- PONTE (fecha manhã, virada pra tarde)
  { type:'bridge', accent:'gold', topicIndex:5, icon:'ponte',
    eyebrow:'FECHAMENTO DA MANHÃ',
    title:['A estrutura que você montou','protege sua família — ou é um','castelo de cartas esperando','o vento de 2027?'],
    sub:'Na volta, nós vamos abrir a caixa-preta.' },
];

const root = document.getElementById('slides');
const stepperEl = document.getElementById('stepper');
let cur = 0;

TOPICS.forEach((name,i)=>{
  const s = document.createElement('div');
  s.className = 'step'; s.dataset.i = i;
  s.innerHTML = `<div class="bar"><i></i></div><div class="name">${String(i+1).padStart(2,'0')} ${name}</div>`;
  stepperEl.appendChild(s);
});

function slideHTML(s){
  const icon = s.icon ? `<div class="icon">${ICONS[s.icon]}</div>` : '';
  if(s.type==='cover'){
    return `<div class="kicker-line"><span class="label">${s.kicker}</span></div>
      <h1>${s.title.join('<br>')}</h1>
      <div class="sub">${s.sub}</div>
      <div class="cover-lion"><img src="assets/leao.png" alt=""></div>`;
  }
  if(s.type==='marker'){
    return `${icon}
      <div class="kicker-line"><span class="num">${s.num}</span><span class="label">${s.label}</span><span class="rule"></span></div>
      <h1>${s.title.join('<br>')}</h1>
      <div class="sub">${s.sub}</div>`;
  }
  if(s.type==='quote'){
    return `<div class="eyebrow">${s.eyebrow}</div>
      <div class="quote">${s.quote}</div>
      ${s.ask ? `<div class="ask">${s.ask}</div>` : ''}`;
  }
  if(s.type==='list'){
    return `<div class="eyebrow">${s.eyebrow}</div>
      <div class="label">${s.label}</div>
      <ul class="bullets">${s.bullets.map(b=>`<li><span class="dia"></span>${b}</li>`).join('')}</ul>`;
  }
  if(s.type==='stat'){
    return `<div class="stat-num">${s.num}</div><div class="stat-sub">${s.statSub}</div>`;
  }
  if(s.type==='bridge'){
    return `${icon}
      <div class="eyebrow">${s.eyebrow}</div>
      <h1>${s.title.join('<br>')}</h1>
      <div class="sub">${s.sub}</div>`;
  }
  return '';
}

SLIDES.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.i = i;
  el.innerHTML = slideHTML(s);
  root.appendChild(el);
});

const slideEls = [...root.children];

function render(){
  const s = SLIDES[cur];
  document.documentElement.style.setProperty('--accent', s.accent==='coral' ? 'var(--coral)' : 'var(--gold)');
  slideEls.forEach((el,i)=> el.classList.toggle('active', i===cur));
  document.getElementById('count-cur').textContent = String(cur+1).padStart(2,'0');
  document.getElementById('count-total').textContent = String(SLIDES.length).padStart(2,'0');
  document.getElementById('kicker-label').textContent =
    s.topicIndex>=0 && s.topicIndex<TOPICS.length ? `Tópico ${s.topicIndex+1} · ${TOPICS[s.topicIndex]}` : 'Reengenharia Empresarial';
  [...stepperEl.children].forEach((el,i)=>{
    el.classList.remove('active','done');
    if(s.topicIndex>i || s.topicIndex===5) el.classList.add('done');
    else if(s.topicIndex===i) el.classList.add('active');
  });
}

function go(delta){
  cur = Math.max(0, Math.min(SLIDES.length-1, cur+delta));
  render();
}

document.getElementById('btn-next').addEventListener('click', ()=>go(1));
document.getElementById('btn-prev').addEventListener('click', ()=>go(-1));
document.getElementById('btn-full').addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' ') go(1);
  else if(e.key==='ArrowLeft') go(-1);
  else if(e.key.toLowerCase()==='f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

render();
</script>
</body>
</html>
